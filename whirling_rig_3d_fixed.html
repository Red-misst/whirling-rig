<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Whirling Rig - Mechanical View</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #1e1e2f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 320px;
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            color: #4ade80;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #4ade80;
            cursor: pointer;
        }
        .data-readout {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            font-family: monospace;
            font-size: 0.95rem;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
        }
        .val-x { color: #f87171; }
        .val-y { color: #60a5fa; }
        
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(20, 20, 30, 0.85);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 350px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #94a3b8;
            pointer-events: none;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        
        /* Professional CAD Annotation Styles */
        .annotation {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #4ade80;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .annotation::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 30px;
            background: #4ade80;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="ui-panel">
        <h2>Apparatus Schematic</h2>
        <div class="control-group" style="margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px;">
            <label for="toggle-labels" style="justify-content: flex-start; align-items: center; cursor: pointer;">
                <input type="checkbox" id="toggle-labels" checked style="width: auto; margin-right: 10px; accent-color: #4ade80; cursor: pointer;">
                Show CAD Annotations
            </label>
        </div>
        <div class="control-group">
            <label><span>Motor Speed (RPM)</span> <span id="rpm-display">0</span></label>
            <input type="range" id="speed-slider" min="0" max="3000" value="0" step="10">
        </div>
        <div class="data-readout">
            <div class="data-row"><span>State:</span> <span id="resonance-state" style="color:#94a3b8;">Resting</span></div>
            <div class="data-row"><span>X Disp:</span> <span class="val-x" id="x-disp">0.00 mm</span></div>
            <div class="data-row"><span>Y Disp:</span> <span class="val-y" id="y-disp">0.00 mm</span></div>
        </div>
        <div style="margin-top: 15px; text-align: center;">
            <a href="README.md" target="_blank" style="color: #1e1e2f; text-decoration: none; font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; display: block; background: #4ade80; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">View Construction Guide</a>
        </div>
    </div>

    <div id="instructions">
        <strong style="color: #fff;">Fixed Viewport:</strong><br>
        The central mass has been resized, and sensors moved back. This prevents physical clipping (glitching) during peak resonance.<br><br>
        <div class="dot" style="background: #ef4444;"></div> X-Axis Sensor (Side)<br>
        <div class="dot" style="background: #3b82f6;"></div> Y-Axis Sensor (Top)<br>
        <div class="dot" style="background: #fbbf24;"></div> Central Mass (Brass)
    </div>

    <script>
        let scene, camera, renderer, labelRenderer, controls;
        let shaftMesh, massMesh, motorMesh;
        let rotationAngle = 0;
        
        // Physics / Simulation variables
        const CRITICAL_SPEED = 1500; 
        const MAX_AMPLITUDE = 1.8; // Capped for realistic display relative to fixed sensors
        let currentRpm = 0;
        let currentAmplitude = 0;

        // Shaft generation parameters
        const yCenter = 3.5; // Bearing centerline height
        const shaftRadius = 0.15;
        const leftBearingX = -10;
        const rightBearingX = 10;

        // UI Elements
        const slider = document.getElementById('speed-slider');
        const rpmDisplay = document.getElementById('rpm-display');
        const xDispDisplay = document.getElementById('x-disp');
        const yDispDisplay = document.getElementById('y-disp');
        const stateDisplay = document.getElementById('resonance-state');
        const labelToggle = document.getElementById('toggle-labels');

        window.onload = function() {
            initScene();
            buildRig();
            setupLights();
            animate();
        };

        function initScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e1e2f);
            scene.fog = new THREE.Fog(0x1e1e2f, 20, 100);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(20, 15, 30);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // Initialize CSS2DRenderer for professional HTML annotations
            labelRenderer = new THREE.CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.target.set(0, yCenter, 0);

            window.addEventListener('resize', onWindowResize, false);
            slider.addEventListener('input', (e) => {
                currentRpm = parseInt(e.target.value);
                rpmDisplay.innerText = currentRpm;
            });

            // Toggle logic for CAD annotations
            labelToggle.addEventListener('change', (e) => {
                if(labelRenderer) {
                    labelRenderer.domElement.style.display = e.target.checked ? 'block' : 'none';
                }
            });
        }

        function setupLights() {
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 15; dirLight.shadow.camera.bottom = -15;
            dirLight.shadow.camera.left = -15; dirLight.shadow.camera.right = 15;
            scene.add(dirLight);
        }

        // Helper function to generate CAD labels
        function createLabel(text, position) {
            const div = document.createElement('div');
            div.className = 'annotation';
            div.textContent = text;
            div.style.marginTop = '-45px'; // Offset higher than the 30px connecting line
            const label = new THREE.CSS2DObject(div);
            label.position.copy(position);
            scene.add(label);
            return label;
        }

        function buildRig() {
            // Materials
            const aluminumMat = new THREE.MeshStandardMaterial({ color: 0x9ca3af, metalness: 0.8, roughness: 0.2 });
            const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.6, roughness: 0.4 });
            const brassMat = new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.9, roughness: 0.3 });
            const sensorXMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.3, roughness: 0.4 });
            const sensorYMat = new THREE.MeshStandardMaterial({ color: 0x3b82f6, metalness: 0.3, roughness: 0.4 });

            // Base
            const baseGeo = new THREE.BoxGeometry(35, 1, 12);
            const base = new THREE.Mesh(baseGeo, new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            base.position.y = -0.5;
            base.receiveShadow = true;
            scene.add(base);

            const railGeo = new THREE.BoxGeometry(30, 0.5, 2);
            const frontRail = new THREE.Mesh(railGeo, aluminumMat);
            frontRail.position.set(0, 0.25, 3);
            scene.add(frontRail);
            
            const backRail = new THREE.Mesh(railGeo, aluminumMat);
            backRail.position.set(0, 0.25, -3);
            scene.add(backRail);

            createLabel('Rigid Aluminum Extrusion Base', new THREE.Vector3(0, 0.5, 3));

            // Motor
            const motorGroup = new THREE.Group();
            const motorBodyGeo = new THREE.CylinderGeometry(1.5, 1.5, 4, 32);
            motorMesh = new THREE.Mesh(motorBodyGeo, darkMetalMat);
            motorMesh.rotation.z = Math.PI / 2;
            motorMesh.position.set(2, 3, 0);
            motorGroup.add(motorMesh);
            motorGroup.position.set(-14, 0.5, 0);
            scene.add(motorGroup);

            createLabel('775 DC Motor & Coupling', new THREE.Vector3(-12, 5, 0));

            // Bearings
            const bearingGeo = new THREE.BoxGeometry(2, 3.5, 2);
            const bearingL = new THREE.Mesh(bearingGeo, darkMetalMat);
            bearingL.position.set(leftBearingX, 2.25, 0);
            scene.add(bearingL);
            const bearingR = new THREE.Mesh(bearingGeo, darkMetalMat);
            bearingR.position.set(rightBearingX, 2.25, 0);
            scene.add(bearingR);

            createLabel('Pillow Block Bearing', new THREE.Vector3(rightBearingX, 4.5, 0));

            // *** FIX 1: RESIZED CENTRAL MASS ***
            const massGeo = new THREE.CylinderGeometry(1.0, 1.0, 0.8, 32);
            massMesh = new THREE.Mesh(massGeo, brassMat);
            massMesh.rotation.z = Math.PI / 2;
            scene.add(massMesh);

            createLabel('Central Brass Mass (Rotor)', new THREE.Vector3(2, yCenter + 2, -2));

            // *** FIX 2: RE-POSITIONED SENSORS (INCREASED CLEARANCE) ***
            // Structural Sensor Bracket (moved back)
            const bracketBase = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 1), aluminumMat);
            bracketBase.position.set(0, 3, -5); // Moved from -3 to -5
            scene.add(bracketBase);
            
            const bracketArm = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 5), aluminumMat);
            bracketArm.position.set(0, 6, -3); // Extends arm over shaft
            scene.add(bracketArm);

            // Y-Sensor (Top) - Moved up to avoid clipping mass at resonance
            const sensorY = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16), sensorYMat);
            sensorY.position.set(0, 7.0, 0); // Position base at 7.0 (Resting shaft is at 3.5)
            scene.add(sensorY);
            
            const laserY = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 6, 8), 
                new THREE.MeshBasicMaterial({ color: 0xaaaaff, transparent: true, opacity: 0.5 }));
            laserY.position.set(0, 4.0, 0); // Visual beam center
            scene.add(laserY);

            createLabel('Y-Axis High-Speed Sensor', new THREE.Vector3(0, 8.5, 0));

            // X-Sensor (Side) - Moved radially outwards
            const sensorX = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 16), sensorXMat);
            sensorX.rotation.x = Math.PI / 2;
            sensorX.position.set(0, yCenter, 3.5); // Resting is z=0, sensor now at z=3.5
            scene.add(sensorX);

            const laserX = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 6, 8), 
                new THREE.MeshBasicMaterial({ color: 0xffaaaa, transparent: true, opacity: 0.5 }));
            laserX.rotation.x = Math.PI / 2;
            laserX.position.set(0, yCenter, 0.5); // Visual beam center
            scene.add(laserX);

            createLabel('X-Axis High-Speed Sensor', new THREE.Vector3(0, yCenter + 1.5, 4.5));

            createLabel('Flexible Steel Shaft', new THREE.Vector3(-5, yCenter, 0));

            // Initial Shaft Setup
            createOrUpdateShaft(0, 0);
        }

        function createOrUpdateShaft(midYOffset, midZOffset) {
            if (shaftMesh) {
                scene.remove(shaftMesh);
                shaftMesh.geometry.dispose();
            }
            
            // *** FIX 3: SMOOTHER BENDING VIA ADDED CONTROL POINTS ***
            const points = [
                new THREE.Vector3(-14, yCenter, 0),                           // Motor coupling
                new THREE.Vector3(leftBearingX, yCenter, 0),                  // Left Bearing
                // Added quarter-span control points for smoother spline curve
                new THREE.Vector3(leftBearingX * 0.5, yCenter + midYOffset * 0.5, midZOffset * 0.5), 
                new THREE.Vector3(0, yCenter + midYOffset, midZOffset),       // Mid-span (Max Deflection)
                new THREE.Vector3(rightBearingX * 0.5, yCenter + midYOffset * 0.5, midZOffset * 0.5),
                new THREE.Vector3(rightBearingX, yCenter, 0)                  // Right Bearing
            ];

            const curve = new THREE.CatmullRomCurve3(points);
            
            // Increased tubular segments (64) and radial segments (12) for smooth geometry
            const tubeGeo = new THREE.TubeGeometry(curve, 64, shaftRadius, 12, false);
            shaftMesh = new THREE.Mesh(tubeGeo, new THREE.MeshStandardMaterial({ color: 0xd1d5db, metalness: 0.9, roughness: 0.2 }));
            shaftMesh.castShadow = true;
            scene.add(shaftMesh);

            // Update mass position to follow the mid-span bend
            if (massMesh) {
                massMesh.position.set(0, yCenter + midYOffset, midZOffset);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Physics update
            const dampingRatio = 0.05;
            const ratio = (currentRpm === 0) ? 0 : currentRpm / CRITICAL_SPEED;
            let targetAmplitude = (currentRpm === 0) ? 0 : 0.05 + (currentRpm / 3000) * 0.15; 
            if (ratio > 0) {
                const resonanceFactor = 1.0 / Math.sqrt(Math.pow((1 - ratio * ratio), 2) + Math.pow(2 * dampingRatio * ratio, 2));
                targetAmplitude += (resonanceFactor * 0.08); // Scaled visual amplitude spike
            }
            // Smoothly interpolate amplitude (fakes physics inertia)
            currentAmplitude = THREE.MathUtils.lerp(currentAmplitude, Math.min(targetAmplitude, MAX_AMPLITUDE), 0.1);
            
            const visualRotationSpeed = (currentRpm * Math.PI * 2) / 3600; 
            rotationAngle += visualRotationSpeed;

            // Calculate instantaneous deflection (Standard mechanics map)
            let deflectionY = 0;
            let deflectionZ = 0; // Note: In ThreeJS context, Z acts as Horizontal(X) displacement
            
            if (currentRpm > 0) {
                // Introduce slight Phase lag for realism
                const phaseLag = (ratio < 1) ? (ratio * (Math.PI / 2)) : (Math.PI/2 + (ratio-1)/(3000/CRITICAL_SPEED - 1)*(Math.PI/2));
                deflectionY = currentAmplitude * Math.sin(rotationAngle - phaseLag);
                deflectionZ = currentAmplitude * Math.cos(rotationAngle - phaseLag);
            }

            // Update Geometry
            createOrUpdateShaft(deflectionY, deflectionZ);

            if (massMesh) {
                massMesh.rotation.x = -rotationAngle; 
            }

            // UI Dashboard update (Z deflection mapped visually to UI "X Disp")
            xDispDisplay.innerText = deflectionZ.toFixed(2) + ' mm';
            yDispDisplay.innerText = deflectionY.toFixed(2) + ' mm';

            // State display
            if (currentRpm === 0) {
                stateDisplay.innerText = 'Resting';
                stateDisplay.style.color = '#94a3b8';
            } else if (currentRpm > CRITICAL_SPEED - 100 && currentRpm < CRITICAL_SPEED + 100) {
                stateDisplay.innerText = 'RESONANCE';
                stateDisplay.style.color = '#ef4444';
            } else if (currentRpm >= CRITICAL_SPEED + 100) {
                stateDisplay.innerText = 'Supercritical';
                stateDisplay.style.color = '#4ade80';
            } else {
                stateDisplay.innerText = 'Subcritical';
                stateDisplay.style.color = '#facc15';
            }

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
