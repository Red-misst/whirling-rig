# Digital Whirling Rig: Architecture & Construction Guide

**1. Executive Summary**

This document outlines the technical architecture for the Digital Whirling Rig, a modern educational laboratory apparatus designed to analyze the circular orbital dynamics (whirling) of a flexible rotating shaft.

Unlike traditional analog setups, this project proposes a fully digital, IoT-enabled pipeline. By utilizing high-speed analog sensors, dual-core microcontroller processing (ESP32), and a WebSocket-based Node.js backend, the system will capture continuous 2D spatial coordinates of a shaft mid-flight. This allows for real-time Fast Fourier Transform (FFT) analysis, automated critical speed detection, and live orbital plotting on a digital dashboard.

## 2. System Objectives

- **Orbital Trajectory Capture:** Continuously measure X and Y lateral displacement of the shaft mid-span.
- **High-Fidelity Signal Integrity:** Maintain a strict hardware-timed sampling rate of at least 1 kHz (1000 Hz) to satisfy the Nyquist-Shannon sampling theorem for shaft speeds up to 3000 RPM (50 Hz fundamental frequency).
- **Resonance Detection:** Provide clean, high-resolution amplitude data to backend software to calculate the first mode of resonance (critical whirling speed).
- **Cost-Effective & Locally Sourced:** Keep prototype costs under KES 15,000 using accessible, off-the-shelf industrial components.

---

## 3. Mechanical Architecture

To ensure the vibration data reflects the shaft dynamics and not environmental noise, the physical rig demands high rigidity.

- **Chassis:** Constructed from 2020 Aluminum Extrusions to provide a rigid, vibration-dampening bed. Use rubber dampening feet on the apparatus base.
- **Drivetrain:** A 12V/24V 775 DC Motor controlled via PWM, coupled rigidly to a 6mm/8mm flexible steel shaft (500mm length).
- **Supports:** The shaft is suspended between two KP08 Pillow Block Bearings to act as simply supported boundary conditions.
- **Central Rotor:** A machined brass or steel mass is secured at the exact mid-span to lower the critical speed into a safe, easily testable RPM range (e.g., 1200 - 1800 RPM).
- **Sensor Bracket:** A custom rigid gantry suspends two sensors at precisely **90°** to each other (Top and Side) over the central mass, maintaining sufficient clearance to prevent physical clipping during maximum amplitude resonance.

---

## 4. Electronics & Hardware Selection

Early design iterations considered I2C Time-of-Flight (ToF) sensors (e.g., VL53L1X). These were rejected during the design review. A ToF sensor's maximum 50 Hz sampling rate will cause complete signal aliasing at standard motor speeds.

### Final Hardware Blueprint
- **Microcontroller:** ESP32 Development Board. Selected for its dual-core processor, built-in WiFi, and high-speed 12-bit Analog-to-Digital Converter (ADC).
- **Sensors:** 2x High-Speed Analog Proximity Sensors (Inductive LJ12A3-4-Z/BX or Infrared TCRT5000). These provide continuous analog voltage relative to distance, allowing the ESP32 ADC to sample at >10 kHz.
- **Signal Conditioning:** Inductive sensors operating at 12V will be routed through a precision resistor voltage divider (10kΩ / 3.3kΩ) to step the logic level down to the ESP32’s safe 3.3V ADC threshold.

## 6. Firmware & Data Pipeline (Software Architecture)

To prevent network jitter and CPU starvation from compromising the time-domain data required for accurate FFT analysis, the ESP32 firmware utilizes a **Dual-Core FreeRTOS Architecture**:

- **Core 1 (Data Acquisition Task):** Dedicated entirely to mechanical readings. A hardware timer interrupt triggers every 1000 μs (1 kHz). It reads the X and Y ADC channels, attaches a high-resolution `esp_timer_get_time()` microsecond timestamp, and pushes the struct into a statically allocated memory buffer.
- **Core 0 (Telemetry Task):** Dedicated to the WiFi and network stack. It monitors the Core 1 buffer. Once a batch of 50 samples is accumulated, Core 0 serializes the data into a binary payload (or dense JSON array) and pushes it over WebSockets to the Node.js server.
- **Backend Analysis:** The Node.js server receives the batched data, unpacks it, calculates the combined magnitude ($Magnitude = \sqrt{X^2 + Y^2}$), and feeds it to the frontend UI for live FFT processing and orbital plotting.

---

## 7. Risk Assessment & Mitigations

| Risk / Failure Mode | Consequence | Implemented Mitigation |
| :--- | :--- | :--- |
| **Data Aliasing** | FFT engine outputs false frequencies; orbit plots look erratic. | Abandoned I2C sensors. Switched to analog sensors sampled at 1,000 Hz via hardware timer interrupts. |
| **Network Jitter** | Time deltas fluctuate ($\Delta t$), destroying FFT spectral accuracy. | Implemented data batching on ESP32. High-precision microsecond timestamps are generated before network transmission. |
| **Mechanical Clipping** | Shaft impacts sensors during resonance, causing physical destruction. | 3D CAD modeling utilized to establish maximum deflection amplitudes; sensors positioned with a calculated radial clearance buffer. |
| **Frame Resonance** | System reads table/frame vibrations rather than pure shaft whirling. | Use of heavy 2020 aluminum extrusions and rubber dampening feet on the apparatus base. |

---

## 8. Conclusion

The proposed Digital Whirling Rig represents a highly capable, modern approach to solid mechanics education. By carefully managing processor load via FreeRTOS and ensuring strict adherence to digital sampling theorems, this apparatus will deliver research-grade vibration telemetry at a fraction of the cost of commercial industrial monitoring equipment.
